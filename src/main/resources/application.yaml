spring:
  application:
    name: claude-initializr

claude-initializr:
  boot-versions:
    - id: "4.1.1"
      nome: "4.1.1"
      padrao: true
  java-versions:
    - id: "21"
      nome: "21"
      padrao: true
    - id: "17"
      nome: "17"
      padrao: false
  build-tools:
    - id: "maven"
      nome: "Maven"
      padrao: true
  dependencias:
    - id: "data-jpa"
      nome: "Spring Data JPA"
      grupo: "SQL"
      descricao: "N+1, @Transactional e DTO em vez de entidade"
    - id: "security"
      nome: "Spring Security"
      grupo: "Segurança"
      descricao: "Autorização no serviço, IDOR e dados sensíveis"
    - id: "data-redis"
      nome: "Spring Data Redis"
      grupo: "NoSQL"
      descricao: "TTL, chaves e cache"
    - id: "data-mongodb"
      nome: "Spring Data MongoDB"
      grupo: "NoSQL"
      descricao: "Limite de documento, índices e transações"
    - id: "kafka"
      nome: "Spring for Apache Kafka"
      grupo: "Mensageria"
      descricao: "Idempotência, ordenação e DLT"
  componentes:
    - id: "rules"
      nome: "rules/"
      padrao: true
    - id: "commands"
      nome: "commands/"
      padrao: true
    - id: "skills"
      nome: "skills/"
      padrao: false
    - id: "agents"
      nome: "agents/"
      padrao: false
    - id: "hooks"
      nome: "hooks/"
      padrao: false
    - id: "mcp"
      nome: ".mcp.json"
      padrao: false
