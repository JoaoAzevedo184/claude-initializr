<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<title>claude-initializr</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
		h1 { font-size: 1.4rem; }
		label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; }
		input, select { width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
		button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; cursor: pointer; }
		fieldset { margin-top: 1rem; }
		fieldset label { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.25rem; font-weight: normal; }
		fieldset input { width: auto; margin: 0; }
		button.secundario { margin-left: 0.5rem; }
		dialog { width: min(960px, 95vw); height: 80vh; padding: 0; border: 1px solid #ccc; }
		dialog[open] { display: flex; flex-direction: column; }
		.explore-topo { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; border-bottom: 1px solid #ddd; }
		.explore-topo button { margin: 0; padding: 0.3rem 0.8rem; }
		.explore-corpo { display: flex; flex: 1; min-height: 0; }
		.explore-arvore { width: 280px; overflow: auto; padding: 0.5rem; border-right: 1px solid #ddd; font-size: 0.85rem; }
		.explore-arvore details { margin-left: 0.8rem; }
		.explore-arvore .arquivo { display: block; margin: 0; padding: 0.1rem 0.3rem; margin-left: 0.8rem; border: 0; background: none; text-align: left; width: 100%; font: inherit; cursor: pointer; }
		.explore-arvore .arquivo.ativo { background: #e3edff; }
		.explore-conteudo { flex: 1; margin: 0; padding: 1rem; overflow: auto; font-size: 0.85rem; white-space: pre-wrap; }
		.erro { color: #b00020; margin-top: 1rem; white-space: pre-wrap; }
	</style>
</head>
<body>
	<h1>claude-initializr</h1>
	<p>Gera a estrutura <code>.claude/</code> pronta pra um projeto Java/Spring Boot.</p>

	<form id="generate-form">
		<label for="group">Group</label>
		<input type="text" id="group" name="group" placeholder="com.exemplo" required>

		<label for="artifact">Artifact</label>
		<input type="text" id="artifact" name="artifact" placeholder="minha-api" required>

		<label for="packageName">Package</label>
		<input type="text" id="packageName" name="packageName" placeholder="com.exemplo.minhaapi" required>

		<label for="bootVersion">Spring Boot</label>
		<select id="bootVersion" name="bootVersion" required></select>

		<label for="javaVersion">Java</label>
		<select id="javaVersion" name="javaVersion" required></select>

		<label for="buildTool">Build tool</label>
		<select id="buildTool" name="buildTool" required></select>

		<fieldset id="dependencias">
			<legend>Dependências</legend>
		</fieldset>

		<fieldset id="componentes">
			<legend>Componentes</legend>
		</fieldset>

		<button type="submit">Gerar .claude/</button>
		<button type="button" class="secundario" id="explore">Explore</button>
	</form>

	<div class="erro" id="erro"></div>

	<dialog id="explore-dialog">
		<div class="explore-topo">
			<strong id="explore-titulo">Explore</strong>
			<button type="button" id="explore-fechar">Fechar</button>
		</div>
		<div class="explore-corpo">
			<nav class="explore-arvore" id="explore-arvore"></nav>
			<pre class="explore-conteudo" id="explore-conteudo"></pre>
		</div>
	</dialog>

	<script>
		function preencherSelect(select, opcoes) {
			select.innerHTML = "";
			for (const opcao of opcoes) {
				const el = document.createElement("option");
				el.value = opcao.id;
				el.textContent = opcao.nome;
				if (opcao.padrao) el.selected = true;
				select.appendChild(el);
			}
		}

		function preencherChecks(fieldset, name, opcoes) {
			for (const opcao of opcoes) {
				const label = document.createElement("label");
				const input = document.createElement("input");
				input.type = "checkbox";
				input.name = name;
				input.value = opcao.id;
				input.checked = !!opcao.padrao;
				label.append(input, opcao.nome);
				if (opcao.descricao) label.title = opcao.descricao;
				fieldset.appendChild(label);
			}
		}

		fetch("/api/metadata")
			.then(resp => resp.json())
			.then(metadata => {
				preencherSelect(document.getElementById("bootVersion"), metadata.bootVersions);
				preencherSelect(document.getElementById("javaVersion"), metadata.javaVersions);
				preencherSelect(document.getElementById("buildTool"), metadata.buildTools);
				preencherChecks(document.getElementById("dependencias"), "dependencias", metadata.dependencias);
				preencherChecks(document.getElementById("componentes"), "componentes", metadata.componentes);
			});

		const form = document.getElementById("generate-form");
		const erroEl = document.getElementById("erro");

		function payload() {
			return {
				group: form.group.value,
				artifact: form.artifact.value,
				packageName: form.packageName.value,
				bootVersion: form.bootVersion.value,
				javaVersion: form.javaVersion.value,
				buildTool: form.buildTool.value,
				dependencias: [...form.querySelectorAll("input[name=dependencias]:checked")].map(i => i.value),
				componentes: [...form.querySelectorAll("input[name=componentes]:checked")].map(i => i.value)
			};
		}

		// Devolve a response ou null (erro já exibido).
		async function enviar(url) {
			erroEl.textContent = "";
			const response = await fetch(url, {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(payload())
			});
			if (!response.ok) {
				const erro = await response.json();
				erroEl.textContent = erro.mensagem + "\n" + JSON.stringify(erro.campos, null, 2);
				return null;
			}
			return response;
		}

		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			const response = await enviar("/api/generate");
			if (!response) return;

			const blob = await response.blob();
			const url = URL.createObjectURL(blob);
			const a = document.createElement("a");
			a.href = url;
			a.download = form.artifact.value + "-claude.zip";
			document.body.appendChild(a);
			a.click();
			a.remove();
			URL.revokeObjectURL(url);
		});

		// --- Explore ---
		const dialog = document.getElementById("explore-dialog");
		const arvoreEl = document.getElementById("explore-arvore");
		const conteudoEl = document.getElementById("explore-conteudo");

		function montarArvore(arquivos) {
			const raiz = {};
			for (const arquivo of arquivos) {
				const partes = arquivo.path.split("/");
				let no = raiz;
				for (const pasta of partes.slice(0, -1)) no = no[pasta] ??= {};
				no[partes.at(-1)] = arquivo;
			}
			return raiz;
		}

		function renderizar(no, pai) {
			const nomes = Object.keys(no).sort((a, b) => {
				const pastaA = !no[a].path, pastaB = !no[b].path;
				return pastaA === pastaB ? a.localeCompare(b) : pastaA ? -1 : 1;
			});
			for (const nome of nomes) {
				const filho = no[nome];
				if (filho.path) {
					const botao = document.createElement("button");
					botao.type = "button";
					botao.className = "arquivo";
					botao.textContent = nome;
					botao.addEventListener("click", () => {
						arvoreEl.querySelectorAll(".ativo").forEach(el => el.classList.remove("ativo"));
						botao.classList.add("ativo");
						conteudoEl.textContent = filho.content;
					});
					pai.appendChild(botao);
				} else {
					const details = document.createElement("details");
					details.open = true;
					const summary = document.createElement("summary");
					summary.textContent = nome + "/";
					details.appendChild(summary);
					renderizar(filho, details);
					pai.appendChild(details);
				}
			}
		}

		document.getElementById("explore").addEventListener("click", async () => {
			if (!form.reportValidity()) return;
			const response = await enviar("/api/preview");
			if (!response) return;

			const { arquivos } = await response.json();
			arvoreEl.innerHTML = "";
			conteudoEl.textContent = "";
			renderizar(montarArvore(arquivos), arvoreEl);
			[...arvoreEl.querySelectorAll(".arquivo")].find(b => b.textContent === "CLAUDE.md")?.click();
			dialog.showModal();
		});

		document.getElementById("explore-fechar").addEventListener("click", () => dialog.close());
	</script>
</body>
</html>
